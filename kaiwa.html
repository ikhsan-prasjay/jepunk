<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Kaiwa Room — Nihongo Studio</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --card: #ffffff;
      --ink: #1f2a37;
      --muted: #69778a;
      --line: #e3e8f0;
      --accent: #c2576d;
      --accent-soft: #ffeaf1;
      --bot: #edf1f7;
      --user: #dff7ec;
      --system: #fff3d9;
      --shadow: 0 16px 34px rgba(24, 35, 52, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f7f7fb 0%, #eef2f6 100%);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .app {
      width: min(940px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, #27364a, #40576d);
      color: white;
    }
    .brand { font-weight: 800; letter-spacing: -0.03em; }
    .nav {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .nav a {
      color: white; text-decoration: none; border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px; padding: 7px 12px; font-size: 0.85rem; font-weight: 700;
    }
    .chat {
      display: flex; flex-direction: column; height: 72vh; min-height: 540px;
      background: #f9fafb;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: min(76%, 540px); padding: 11px 14px; border-radius: 16px; line-height: 1.6;
      font-size: 0.98rem; box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 6px; }
    .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 6px; }
    .msg.system { align-self: center; background: var(--system); border-radius: 12px; max-width: 90%; }
    .composer {
      display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 14px 16px 18px; border-top: 1px solid var(--line); background: rgba(255,255,255,0.8);
    }
    .composer input {
      border: 1px solid var(--line); border-radius: 12px; min-height: 46px; padding: 0 14px; font-size: 1rem;
    }
    .composer button {
      border: 1px solid transparent; border-radius: 12px; padding: 0 16px; min-height: 46px; font-weight: 800; cursor: pointer;
    }
    .primary { background: var(--accent); color: white; }
    .secondary { background: var(--accent-soft); color: var(--ink); border-color: var(--accent-soft); }
    .push-btn { min-width: 120px; }
    .push-btn.active { background: #2d5e43; color: white; }
    @media (max-width: 600px) {
      .composer { grid-template-columns: 1fr; }
      .msg { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">AI Kaiwa Room</div>
      <nav class="nav" aria-label="Navigasi kaiwa">
        <a href="index.html">Beranda</a>
        <a href="latihan-soal.html">JLPT</a>
      </nav>
    </header>

    <main class="chat">
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="chatInput" type="text" maxlength="300" placeholder="Ketik pesanmu dalam bahasa Jepang..." aria-label="Input percakapan" />
        <button class="secondary push-btn" id="voiceBtn" type="button">Push-to-talk</button>
        <button class="primary" id="sendBtn" type="button">Kirim</button>
      </div>
    </main>
  </div>

  <script src="./kaiwa-engine.js"></script>
</body>
</html>
